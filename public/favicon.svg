<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#E6B422"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="75%" stop-color="#E6B422"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>

    <linearGradient id="goldLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6C0"/>
      <stop offset="50%" stop-color="#E6B422"/>
      <stop offset="100%" stop-color="#9C6F0A"/>
    </linearGradient>

    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="50%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2196F3" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0D47A1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0D47A1" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo negro sólido -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Anillo exterior dorado -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold)" stroke-width="10"/>

  <!-- Segundo anillo dorado -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.9"/>

  <!-- Anillo azul brillante satinado -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#blue)" stroke-width="18"/>

  <!-- Brillo superior del anillo azul (satinado) -->
  <path d="M 90 180 A 190 190 0 0 1 422 180"
        fill="none" stroke="#B3E5FC" stroke-width="4" opacity="0.7" stroke-linecap="round"/>

  <!-- Resplandor azul detrás de la letra -->
  <circle cx="256" cy="256" r="130" fill="url(#blueGlow)"/>

  <!-- ============================================== -->
  <!-- LETRA "D" CON CONTRAHUECO (regla evenodd)      -->
  <!-- El trazo exterior define la forma,             -->
  <!-- el trazo interior (mismo sentido) recorta el  -->
  <!-- hueco interno gracias a fill-rule="evenodd"    -->
  <!-- ============================================== -->
  <path fill-rule="evenodd"
        d="M 185 145
           L 255 145
           C 350 145, 390 200, 390 256
           C 390 312, 350 367, 255 367
           L 185 367
           Z
           M 235 190
           L 250 190
           C 315 190, 345 220, 345 256
           C 345 292, 315 322, 250 322
           L 235 322
           Z"
        fill="url(#goldLetter)"
        filter="url(#shadow)"/>

  <!-- Reflejo de luz sutil en el trazo de la D -->
  <path d="M 210 165 L 255 165 C 315 165, 355 205, 360 250"
        fill="none" stroke="#FFFDE7" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
</svg>